name: Validate

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  validate-hacs:
    runs-on: "ubuntu-latest"
    name: Validate HACS
    steps:
      - uses: "actions/checkout@v5"
      - name: HACS validation
        uses: "hacs/action@main"
        with:
          category: "integration"
          # Not yet in home-assistant/brands -- submit before first release (Phase 6)
          ignore: "brands"

  validate-hassfest:
    runs-on: "ubuntu-latest"
    name: Validate Hassfest
    steps:
      - uses: "actions/checkout@v5"
      - name: Hassfest validation
        uses: "home-assistant/actions/hassfest@master"
