site_name: Energy Manager
site_description: Price-optimized home energy management for Home Assistant.
site_url: https://energy-manager.dinsten.se

repo_name: jyourstone/energy_manager
repo_url: https://github.com/jyourstone/energy_manager
edit_uri: edit/main/docs/content/

docs_dir: content

theme:
  name: material
  custom_dir: overrides
  logo: images/logo.png
  favicon: images/logo.png
  palette:
    - scheme: slate
      primary: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight

nav:
  - Home: index.md
  - Getting Started:
    - Installation & Requirements: getting-started/installation.md
    - Setup Wizard: getting-started/setup-wizard.md
    - Your First Days (Observe-Only Mode): getting-started/first-days.md
  - User Guide:
    - Home Battery: user-guide/home-battery.md
    - Battery to Grid Export Arbitrage: user-guide/battery-export-arbitrage.md
    - EV Charging: user-guide/ev-charging.md
    - Solar Appliances: user-guide/solar-appliances.md
  - Bring Your Own Hardware:
    - Command Sensors: bring-your-own-hardware/command-sensors.md
    - Charger Status Contract: bring-your-own-hardware/charger-status.md
    - Worked Examples: bring-your-own-hardware/examples.md
  - Reference:
    - Entities: reference/entities.md
    - Repairs & Diagnostics: reference/repairs-diagnostics.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - admonition
  - pymdownx.details
  - pymdownx.tasklist:
      custom_checkbox: true
  - attr_list
  - md_in_html

extra_css:
  - extra.css
